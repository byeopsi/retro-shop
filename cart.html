<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/cart-style.css" />
    <title>Retro Shop</title>
</head>
<body>
    <div id="retro-shop-app">
        <section id="left-container">
        </section>
        <section id="right-container">
            <nav>
                <ul>
                    <li class="menu" id="home"><a>HOME</a></li>
                    <li class="menu" id="new"><a>NEW</a></li>
                    <li class="menu" id="cloth"><a>CLOTH</a></li>
                    <li class="menu" id="socks"><a>SOCKS</a></li>
                    <li class="menu" id="shoes"><a>SHOES</a></li>
                    <li class="menu hidden" id="cart"><a>🛒</a></li>
                </ul>
            </nav>
            <main>
              <h3>장바구니</h3>
              <div class="cart-table">
                <div class="cart-header row">
                  <div class="cell"><input type="checkbox" /></div>
                  <div class="cell">이미지</div>
                  <div class="cell">상품명</div>
                  <div class="cell">가격</div>
                  <div class="cell">수량</div>
                  <div class="cell">총합</div>
                </div>
                <div class="cart-rows row">
                </div>
                <div class="cart-footer">
                </div>
                <div class="cart-end">
                  <div class="cell"><button onclick="deleteAllItem()">전체삭제</button></div>
                  <div class="cell"><button onclick="deleteItem()">선택삭제</button></div>
                  <div class="cell"><button>구매</button></div>
                </div>
              </div>
            </main>
        </section>
        <div id="toggle-btn">
          <span>DAY</span>
        </div>
        <footer>2026 @beyopsi</footer>
    </div>
    <script src="./assets/js/loadLeftContainer.js"></script>
    <script src="./assets/js/loadMenus.js"></script>
    <script src="./assets/js/loadItems.js"></script>
    <script src="./assets/js/loadCart.js"></script>
    <script src="./assets/js/toggleMode.js"></script>
</body>
</html>
